name: Build MaxVibeBanner dylib

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build arm64 dylib
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK=$SDK"
          # Soft SecItem (main-image fishhook) + app-group container redirect + contentsOfDirectory safety
          clang -dynamiclib \
            -target arm64-apple-ios15.0 \
            -isysroot "$SDK" \
            -fobjc-arc \
            -I banner \
            -framework Foundation \
            -framework UIKit \
            -framework Security \
            -framework CoreGraphics \
            -framework QuartzCore \
            -install_name "@executable_path/Frameworks/MaxVibeBanner.dylib" \
            -o MaxVibeBanner.dylib \
            banner/fishhook.c \
            banner/MaxVibePersist.m \
            banner/MaxVibeAntiDelete.m \
            banner/MaxVibeGhost.m \
            banner/MaxVibeBanner.m
          lipo -info MaxVibeBanner.dylib
          ls -la MaxVibeBanner.dylib

      - name: Package artifact
        run: |
          mkdir -p dist
          cp MaxVibeBanner.dylib dist/
          cp banner/banner_character.png dist/
          cp banner/entitlements.plist dist/
          cp scripts/inject_banner.py dist/
          mkdir -p dist/icons
          cp banner/icons/*.png dist/icons/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaxVibeBanner-dylib
          path: dist/
          if-no-files-found: error
